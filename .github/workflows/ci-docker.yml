name: ci-docker

# This workflow builds and pushes a multi-arch Docker image to DockerHub,
# and tags the commit with the current version of the package.
#
# This workflow is triggered by:
#   - a manual trigger (workflow_dispatch)
#     This workflow should always be run against a git tag.
#   - a release is published
#
# Required repository configuration:
#   - vars.DOCKERHUB_USERNAME
#   - secrets.DOCKERHUB_TOKEN

on:
  workflow_dispatch:
  release:
    types: [published]

# Needed by the "Push tag" step: the default GITHUB_TOKEN is read-only on new repos.
permissions:
  contents: write

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Get version
        id: get_version
        run: |
          case ${{ github.event_name }} in
            workflow_dispatch)
              version=${{ github.ref_name }}
              ;;
            release)
              version=${{ github.event.release.tag_name }}
              ;;
          esac
          echo "VERSION=$version" >> $GITHUB_ENV
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/shadowsocks-rust:latest
            ${{ vars.DOCKERHUB_USERNAME }}/shadowsocks-rust:${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
      - name: Set up git user
        run: |
          git config --global user.name "ci-docker.github-actions[bot]"
          git config --global user.email "ci-docker.github.actions[bot]@noreply.github.com"
      - name: Tag commit
        run: git tag -a -m "" "docker-${{ env.VERSION }}"
      - name: Push tag
        run: git push origin "refs/tags/docker-${{ env.VERSION }}"
